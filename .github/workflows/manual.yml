# Builds the user manual (German + English) as PDF and Word from
# docs/manual/*.md and publishes it in the release "manual":
#   https://github.com/cgraf63/SHACK-SERVER/releases/tag/manual
# Fixed download links, e.g.
#   .../releases/download/manual/SHACK-SERVER_Handbuch_DE.pdf

name: Manual

on:
  push:
    branches: [main]
    paths:
      - "docs/manual/**"
      - "docs/images/screenshots/**"
      - ".github/workflows/manual.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # date of the last change of the manual

      # no apt: pandoc and the Inter font from their GitHub releases
      - name: Tools
        run: |
          curl -fsSL --retry 3 -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb
          curl -fsSL --retry 3 -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip
          mkdir -p ~/.local/share/fonts/inter
          unzip -q -o /tmp/inter.zip -d /tmp/inter
          find /tmp/inter -name "Inter-*.otf" -o -name "Inter-*.ttf" | grep -v Display | xargs -I{} cp {} ~/.local/share/fonts/inter/
          fc-cache -f >/dev/null
          fc-list | grep -c "Inter" || true
          pip install --break-system-packages playwright pypdf
          python3 -m playwright install chromium

      - name: Build
        run: python3 docs/manual/build.py

      - uses: actions/upload-artifact@v6
        with:
          name: manual
          path: docs/manual/out/*

      - name: Publish (release "manual")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view manual >/dev/null 2>&1; then
            gh release create manual --target main --title "User manual / Benutzerhandbuch" \
              --notes "Always the latest user manual (German and English, PDF and Word). Built automatically from docs/manual."
          fi
          gh release upload manual docs/manual/out/* --clobber
