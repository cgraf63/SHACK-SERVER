# SHACK-SERVER demo (Docker Desktop on Windows / macOS / Linux)
#
#   docker compose up -d      -> http://localhost:3000
#   docker compose down       -> stop and remove (demo data is reset)
#
# The full version runs on a Raspberry Pi: scripts/install.sh

services:
  shack-demo:
    image: ghcr.io/cgraf63/shack-server:demo
    container_name: shack-demo
    ports:
      - "3000:3000"
    restart: unless-stopped
