<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>SHACK-SERVER - Settings</title>

    <link
        rel="stylesheet"
        href="/style.css">

    <style>

        .settings-page {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
        }

        .settings-section {
            margin-bottom: 30px;
        }

        .settings-section h2 {
            margin-bottom: 20px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 14px 20px;
            align-items: center;
        }

        .settings-grid label {
            font-weight: 600;
        }

        .settings-grid input {
            width: 100%;
            box-sizing: border-box;
            padding: 9px 12px;
        }

        .source-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 12px 0;
        }

        .source-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }

        .dxspider-list {
            margin-top: 20px;
        }

        .dxspider-card {
            border: 1px solid #444;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .dxspider-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .dxspider-title {
            font-size: 18px;
            font-weight: 600;
        }

        .dxspider-enabled {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dxspider-enabled input {
            width: 18px;
            height: 18px;
        }

        .dxspider-grid {
            display: grid;
            grid-template-columns: 120px 1fr 120px 1fr;
            gap: 12px 15px;
            align-items: center;
        }

        .dxspider-grid label {
            font-weight: 600;
        }

        .dxspider-grid input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px;
        }

        .dxspider-actions {
            margin-top: 15px;
            text-align: right;
        }

        .add-dxspider {
            margin-top: 15px;
            padding: 9px 18px;
            cursor: pointer;
        }

        .remove-dxspider {
            padding: 6px 12px;
            cursor: pointer;
        }

        .settings-actions {
            margin-top: 30px;
        }

        .settings-save {
            padding: 10px 24px;
            cursor: pointer;
        }

        .settings-message {
            margin-top: 15px;
            min-height: 20px;
        }

        @media (max-width: 700px) {

            .settings-page {
                margin: 10px;
                padding: 15px;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }

            .dxspider-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="settings-page">


    <h1>SHACK-SERVER Settings</h1>


    <!-- ================================================= -->
    <!-- STATION -->
    <!-- ================================================= -->

    <div class="settings-section">

        <h2>Station</h2>


        <div class="settings-grid">

            <label for="callsign">
                Callsign
            </label>

            <input
                id="callsign"
                type="text">


            <label for="operatorName">
                Operator
            </label>

            <input
                id="operatorName"
                type="text">


            <label for="locator">
                QTH Locator
            </label>

            <input
                id="locator"
                type="text">


            <label for="club">
                Club
            </label>

            <input
                id="club"
                type="text">

        </div>

    </div>


    <!-- ================================================= -->
    <!-- DX SOURCES -->
    <!-- ================================================= -->

    <div class="settings-section">

        <h2>DX Sources</h2>


        <!-- ============================================= -->
        <!-- DXSPIDER MASTER SWITCH -->
        <!-- ============================================= -->

        <div class="source-row">

            <input
                id="source-dxspider"
                type="checkbox">

            <label for="source-dxspider">
                DXSpider
            </label>

        </div>


        <!-- ============================================= -->
        <!-- DXSPIDER SERVERS -->
        <!-- ============================================= -->

        <div
            id="dxspider-list"
            class="dxspider-list">
        </div>


        <button
            id="add-dxspider"
            class="add-dxspider"
            type="button">

            + Add DXSpider

        </button>


        <!-- ============================================= -->
        <!-- HOLYCLUSTER -->
        <!-- ============================================= -->

        <div class="source-row">

            <input
                id="source-holycluster"
                type="checkbox">

            <label for="source-holycluster">
                HolyCluster
            </label>

        </div>


        <!-- ============================================= -->
        <!-- DX SUMMIT -->
        <!-- ============================================= -->

        <div class="source-row">

            <input
                id="source-dxsummit"
                type="checkbox">

            <label for="source-dxsummit">
                DX Summit
            </label>

        </div>

    </div>


    <!-- ================================================= -->
    <!-- ACTIONS -->
    <!-- ================================================= -->

    <div class="settings-actions">

        <button
            id="save-settings"
            class="settings-save"
            type="button">

            Save Settings

        </button>


        <div
            id="settings-message"
            class="settings-message">
        </div>

    </div>


</div>


<script>


let dxspiders = [];



/* ===================================================== */
/* LOAD SETTINGS                                         */
/* ===================================================== */

async function loadSettings() {

    try {

        const response =
            await fetch(
                "/api/settings?_=" + Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Failed to load settings"
            );

        }


        const settings =
            await response.json();


        document.getElementById(
            "callsign"
        ).value =
            settings.callsign ?? "";


        document.getElementById(
            "operatorName"
        ).value =
            settings.operatorName ?? "";


        document.getElementById(
            "locator"
        ).value =
            settings.locator ?? "";


        document.getElementById(
            "club"
        ).value =
            settings.club ?? "";


        document.getElementById(
            "source-dxspider"
        ).checked =
            settings.sources?.dxspider ?? false;


        document.getElementById(
            "source-holycluster"
        ).checked =
            settings.sources?.holycluster ?? false;


        document.getElementById(
            "source-dxsummit"
        ).checked =
            settings.sources?.dxsummit ?? false;


        dxspiders =
            Array.isArray(
                settings.dxspiders
            )
                ? settings.dxspiders.map(
                    spider => ({
                        ...spider
                    })
                )
                : [];


        renderDxSpiders();

    }
    catch (error) {

        console.error(
            error
        );

        showMessage(
            "Failed to load settings"
        );

    }

}



/* ===================================================== */
/* RENDER DXSPIDER LIST                                  */
/* ===================================================== */

function renderDxSpiders() {

    const container =
        document.getElementById(
            "dxspider-list"
        );


    container.innerHTML = "";


    dxspiders.forEach(
        (spider, index) => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "dxspider-card";


            card.innerHTML = `

                <div class="dxspider-header">

                    <div class="dxspider-title">
                        ${escapeHtml(
                            spider.name || "DXSpider"
                        )}
                    </div>


                    <label
                        class="dxspider-enabled">

                        <input
                            type="checkbox"
                            data-field="enabled"
                            ${spider.enabled ? "checked" : ""}>

                        Enabled

                    </label>

                </div>


                <div class="dxspider-grid">

                    <label>
                        Name
                    </label>

                    <input
                        type="text"
                        data-field="name"
                        value="${escapeAttribute(
                            spider.name ?? ""
                        )}">


                    <label>
                        Host
                    </label>

                    <input
                        type="text"
                        data-field="host"
                        value="${escapeAttribute(
                            spider.host ?? ""
                        )}">


                    <label>
                        Port
                    </label>

                    <input
                        type="number"
                        data-field="port"
                        value="${spider.port ?? 8000}">


                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        data-field="password"
                        value="${escapeAttribute(
                            spider.password ?? ""
                        )}">

                </div>


                <div class="dxspider-actions">

                    <button
                        type="button"
                        class="remove-dxspider">

                        Remove

                    </button>

                </div>

            `;


            const inputs =
                card.querySelectorAll(
                    "[data-field]"
                );


            inputs.forEach(
                input => {

                    input.addEventListener(
                        "input",
                        () => {

                            const field =
                                input.dataset.field;


                            if (
                                !field
                            ) {
                                return;
                            }


                            if (
                                input.type ===
                                "checkbox"
                            ) {

                                spider[field] =
                                    input.checked;

                            }
                            else if (
                                input.type ===
                                "number"
                            ) {

                                spider[field] =
                                    Number(
                                        input.value
                                    );

                            }
                            else {

                                spider[field] =
                                    input.value;

                            }


                            updateDxSpiderTitle(
                                card,
                                spider
                            );

                        }
                    );

                }
            );


            card.querySelector(
                ".remove-dxspider"
            ).addEventListener(
                "click",
                () => {

                    dxspiders.splice(
                        index,
                        1
                    );


                    renderDxSpiders();

                }
            );


            container.appendChild(
                card
            );

        }
    );

}



/* ===================================================== */
/* UPDATE CARD TITLE                                     */
/* ===================================================== */

function updateDxSpiderTitle(
    card,
    spider
) {

    const title =
        card.querySelector(
            ".dxspider-title"
        );


    if (title) {

        title.textContent =
            spider.name ||
            "DXSpider";

    }

}



/* ===================================================== */
/* ADD DXSPIDER                                           */
/* ===================================================== */

function addDxSpider() {

    dxspiders.push({

        name:
            "New DXSpider",

        host:
            "",

        port:
            8000,

        password:
            "",

        enabled:
            true

    });


    renderDxSpiders();

}



/* ===================================================== */
/* SAVE SETTINGS                                          */
/* ===================================================== */

async function saveSettings() {

    const settings = {

        callsign:
            document.getElementById(
                "callsign"
            ).value.trim(),


        operatorName:
            document.getElementById(
                "operatorName"
            ).value.trim(),


        locator:
            document.getElementById(
                "locator"
            ).value.trim(),


        club:
            document.getElementById(
                "club"
            ).value.trim(),


        sources: {

            dxspider:
                document.getElementById(
                    "source-dxspider"
                ).checked,


            holycluster:
                document.getElementById(
                    "source-holycluster"
                ).checked,


            dxsummit:
                document.getElementById(
                    "source-dxsummit"
                ).checked

        },


        dxspiders:
            dxspiders

    };


    try {

        const response =
            await fetch(
                "/api/settings",
                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            settings
                        )

                }
            );


        if (!response.ok) {

            throw new Error(
                "Failed to save settings"
            );

        }


        const saved =
            await response.json();


        dxspiders =
            Array.isArray(
                saved.dxspiders
            )
                ? saved.dxspiders
                : [];


        renderDxSpiders();


        showMessage(
            "Settings saved."
        );

    }
    catch (error) {

        console.error(
            error
        );

        showMessage(
            "Failed to save settings."
        );

    }

}



/* ===================================================== */
/* MESSAGE                                               */
/* ===================================================== */

function showMessage(
    message
) {

    document.getElementById(
        "settings-message"
    ).textContent =
        message;

}



/* ===================================================== */
/* HTML ESCAPING                                         */
/* ===================================================== */

function escapeHtml(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(
    value
) {

    return escapeHtml(
        value
    );

}



/* ===================================================== */
/* EVENTS                                                */
/* ===================================================== */

document.getElementById(
    "add-dxspider"
).addEventListener(
    "click",
    addDxSpider
);


document.getElementById(
    "save-settings"
).addEventListener(
    "click",
    saveSettings
);



/* ===================================================== */
/* INITIAL LOAD                                           */
/* ===================================================== */

loadSettings();

</script>


</body>

</html>
