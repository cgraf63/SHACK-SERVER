<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year in Review - SHACK-SERVER</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/layout.css?v=2">
    <link rel="stylesheet" href="/css/components.css?v=36">
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="/css/review.css?v=1">
</head>

<body>

<div id="app">

    <div id="sidebar"></div>

    <main>
        <div class="yr-page">

            <header class="yr-header">
                <div>
                    <div class="yr-kicker" id="yr-call">YOUR STATION</div>
                    <h1><span id="yr-year">----</span> <em>YEAR IN REVIEW</em></h1>
                    <div class="yr-sub" id="yr-sub">from your QSO log</div>
                </div>
                <div class="yr-years" id="yr-years" role="group" aria-label="Year"></div>
            </header>

            <div class="yr-empty" id="yr-empty" hidden>No QSOs in this year.</div>

            <section class="yr-hero" id="yr-hero"></section>

            <section class="yr-card yr-map-card">
                <div class="yr-card-head">
                    <span class="yr-card-title">WORKED THIS YEAR</span>
                    <div class="yr-chips" id="yr-map-bands"></div>
                </div>
                <div id="yr-map" class="yr-map"></div>
            </section>

            <section class="yr-grid">
                <div class="yr-card">
                    <div class="yr-card-head"><span class="yr-card-title">QSOS PER MONTH</span></div>
                    <div class="yr-chart" id="yr-months"></div>
                </div>
                <div class="yr-card">
                    <div class="yr-card-head"><span class="yr-card-title">BANDS</span></div>
                    <div class="yr-bars" id="yr-bands"></div>
                </div>
                <div class="yr-card">
                    <div class="yr-card-head"><span class="yr-card-title">MODES</span></div>
                    <div class="yr-donut" id="yr-modes"></div>
                </div>
                <div class="yr-card">
                    <div class="yr-card-head"><span class="yr-card-title">HOUR OF DAY (UTC)</span></div>
                    <div class="yr-chart" id="yr-hours"></div>
                </div>
            </section>

            <section class="yr-grid yr-grid-3">
                <div class="yr-card">
                    <div class="yr-card-head"><span class="yr-card-title">TOP COUNTRIES</span></div>
                    <div class="yr-top" id="yr-top"></div>
                </div>
                <div class="yr-card">
                    <div class="yr-card-head">
                        <span class="yr-card-title">NEW DXCC</span>
                        <span class="yr-hint">first QSO ever with the entity</span>
                    </div>
                    <div class="yr-new" id="yr-new"></div>
                </div>
                <div class="yr-col">
                    <div class="yr-card yr-highlight" id="yr-far"></div>
                    <div class="yr-card yr-highlight" id="yr-best"></div>
                </div>
            </section>

        </div>
    </main>

</div>

<script src="/js/component-loader.js?v=28"></script>
<script src="/js/system-status.js?v=2"></script>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/js/review.js?v=1"></script>
<script src="/js/demo-banner.js?v=1"></script>
</body>
</html>
