<style>
    /* Station: two fields per row, not full width */
    .settings-grid {
        grid-template-columns: 110px minmax(0, 1fr) 110px minmax(0, 1fr);
        gap: 10px 16px;
        max-width: 760px;
    }
    .settings-grid label { font-size: 13px; }
    .settings-grid input { padding: 8px 10px; font-size: 13px; }

    /* DXSpider rows: dark fields like the rest of the dialog */
    .dxspider-head,
    .dxspider-row {
        display: grid;
        grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1.5fr) 80px minmax(0, 1fr) 34px;
        gap: 8px;
        align-items: center;
    }
    .dxspider-head {
        margin: 4px 0 2px;
        color: #8fa3b2;
        font-size: 11px;
        letter-spacing: .06em;
        text-transform: uppercase;
    }
    .dxspider-row { margin: 6px 0; }
    .dxspider-row input[type="text"],
    .dxspider-row input[type="number"],
    .dxspider-row input[type="password"] {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 10px;
        border: 1px solid var(--border-color, #303640);
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.04);
        color: inherit;
        font: inherit;
        font-size: 13px;
    }
    .dxspider-row input:focus { outline: none; border-color: #607d8b; }
    .dxspider-row input[type="checkbox"] { display: block; width: 16px; height: 16px; margin: 0 auto; cursor: pointer; accent-color: #00b4d8; }
    .dxspider-remove {
        height: 32px;
        border: 1px solid var(--border-color, #303640);
        border-radius: 5px;
        background: transparent;
        color: #8fa3b2;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
    }
    .dxspider-remove:hover { color: #ff6b6b; border-color: #7d2632; background: rgba(255, 82, 82, 0.08); }

    @media (max-width: 700px) {
        .settings-grid { grid-template-columns: 1fr; }
        .dxspider-head { display: none; }
        .dxspider-row { grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1fr) 34px; }
        .dxspider-row .dxspider-host,
        .dxspider-row .dxspider-password { grid-column: 2 / 4; }
    }
</style>

<div class="settings-header">

    <div class="settings-title">
        ⚙ Settings
    </div>

<button
        type="button"
        class="settings-close"
        onclick="closeSettings()"
        title="Close">
        ×
    </button>




</div>


<div class="settings-content">


    <!-- =========================
         STATION
         ========================= -->

    <section class="settings-section">

        <h2>Station</h2>

        <div class="settings-grid">

            <label for="callsign">
                Callsign
            </label>

            <input
                id="callsign"
                type="text">


            <label for="operatorName">
                Operator
            </label>

            <input
                id="operatorName"
                type="text">


            <label for="settings-locator">
                QTH Locator
            </label>

            <input
                id="settings-locator"
                type="text">


            <label for="club">
                Club
            </label>

            <input
                id="club"
                type="text">

        </div>

    </section>


    <!-- =========================
         TRANSCEIVERS
         (saved immediately, independent of "Save Settings")
         ========================= -->

    <section class="settings-section radio-settings">

        <h2>Transceivers</h2>

        <p class="radio-settings-intro">
            Changes in this section are applied immediately.
            Use <strong>Test connection</strong> before saving.
        </p>

        <div
            id="radio-list"
            class="radio-list">
        </div>

        <button
            id="radio-add"
            class="settings-secondary-button"
            type="button">

            + Add Transceiver

        </button>


        <!-- Add / edit form -->

        <div
            id="radio-form"
            class="radio-form"
            hidden>

            <div class="radio-form-title" id="radio-form-title">
                Add Transceiver
            </div>

            <div class="radio-form-grid">

                <label for="radio-name">Name</label>
                <input
                    id="radio-name"
                    type="text"
                    maxlength="60"
                    placeholder="e.g. YAESU FTDX10">


                <label for="radio-driver">Transceiver / driver</label>
                <div>
                    <select id="radio-driver"></select>
                    <div id="radio-driver-models" class="radio-help"></div>
                </div>


                <!-- Hamlib only -->
                <label class="radio-hamlib-field">Connection</label>
                <div class="radio-hamlib-field radio-connection">
                    <label class="radio-check">
                        <input type="radio" name="radio-connection" value="serial" checked>
                        <span>USB / serial port - SHACK-SERVER starts rigctld</span>
                    </label>
                    <label class="radio-check">
                        <input type="radio" name="radio-connection" value="network">
                        <span>Existing rigctld (shared with WSJT-X, logbook, …)</span>
                    </label>
                </div>

                <label class="radio-hamlib-model-field" for="radio-hamlib-mfg">Manufacturer</label>
                <div class="radio-hamlib-model-field">
                    <select id="radio-hamlib-mfg"></select>
                    <div id="radio-hamlib-status" class="radio-help"></div>
                </div>

                <label class="radio-hamlib-model-field" for="radio-hamlib-model">Model</label>
                <select id="radio-hamlib-model" class="radio-hamlib-model-field"></select>

                <label class="radio-network-field" for="radio-host">rigctld host</label>
                <input
                    id="radio-host"
                    class="radio-network-field"
                    type="text"
                    placeholder="127.0.0.1">

                <label class="radio-network-field" for="radio-tcp-port">rigctld port</label>
                <input
                    id="radio-tcp-port"
                    class="radio-network-field"
                    type="text"
                    inputmode="numeric"
                    placeholder="4532">


                <label class="radio-serial-field" for="radio-port">Serial port</label>
                <div class="radio-serial-field">
                    <div class="radio-port-row">
                        <select id="radio-port"></select>
                        <button
                            id="radio-port-refresh"
                            class="settings-secondary-button"
                            type="button"
                            title="Search for ports again (e.g. after plugging in)">
                            Refresh
                        </button>
                    </div>
                    <input
                        id="radio-port-manual"
                        type="text"
                        placeholder="/dev/..."
                        hidden>
                    <div id="radio-port-help" class="radio-help"></div>
                </div>


                <label class="radio-serial-field" for="radio-baud">Baud rate</label>
                <select id="radio-baud" class="radio-serial-field"></select>


                <label for="radio-civ" class="radio-civ-field">CI-V address (hex)</label>
                <input
                    id="radio-civ"
                    class="radio-civ-field"
                    type="text"
                    maxlength="2"
                    placeholder="A4">


                <label for="radio-enabled">Enabled</label>
                <label class="radio-check">
                    <input id="radio-enabled" type="checkbox" checked>
                    <span>Connect this transceiver</span>
                </label>

            </div>

            <div id="radio-driver-hint" class="radio-hint"></div>

            <div class="radio-form-actions">

                <button
                    id="radio-test"
                    class="settings-secondary-button radio-test-button"
                    type="button">
                    Test connection
                </button>

                <button
                    id="radio-save"
                    class="settings-save"
                    type="button">
                    Save transceiver
                </button>

                <button
                    id="radio-cancel"
                    class="settings-cancel"
                    type="button">
                    Cancel
                </button>

            </div>

            <div
                id="radio-result"
                class="radio-result"
                role="status"
                aria-live="polite"
                hidden>
            </div>

        </div>

    </section>


    <!-- =========================
         DX SOURCES
         ========================= -->

    <section class="settings-section">

        <h2>DX Sources</h2>


        <!-- DXSpider master switch -->

        <div class="source-master-row">

            <label class="source-switch">

                <input
                    id="source-dxspider"
                    type="checkbox">

                <span>
                    DXSpider
                </span>

            </label>

        </div>


        <!-- DXSpider instances -->

        <div
            id="dxspider-list"
            class="dxspider-list">
        </div>


        <button
            id="add-dxspider"
            class="settings-secondary-button"
            type="button">

            + Add DXSpider

        </button>


        <!-- HolyCluster -->

        <div class="source-master-row">

            <label class="source-switch">

                <input
                    id="source-holycluster"
                    type="checkbox">

                <span>
                    HolyCluster
                </span>

            </label>

        </div>


        <!-- DX Summit -->

        <div class="source-master-row">

            <label class="source-switch">

                <input
                    id="source-dxsummit"
                    type="checkbox">

                <span>
                    DX Summit
                </span>

            </label>

        </div>

    </section>


    <!-- =========================
         OPTIONAL MODULES
         ========================= -->

    <section class="settings-section">

        <h2>Optional Modules</h2>

        <style>
            .module-hint { margin-left: 8px; color: #8fa3b2; font-size: 12px; font-weight: 400; }
        </style>

        <p class="radio-settings-intro">
            Show these pages in the sidebar only when you use them.
        </p>

        <div class="source-master-row">
            <label class="source-switch">
                <input
                    id="module-rbn"
                    type="checkbox">
                <span>
                    RBN
                    <small class="module-hint">Reverse Beacon Network spots · memory keys only with Yaesu FTDX10 / FTX-1</small>
                </span>
            </label>
        </div>

        <div class="source-master-row">
            <label class="source-switch">
                <input
                    id="module-sdr"
                    type="checkbox">
                <span>
                    SDR
                    <small class="module-hint">Spectrum with SDRplay RSP1B · needs the receiver and the SDRplay API</small>
                </span>
            </label>
        </div>

    </section>


    <!-- =========================
         ACTIONS
         ========================= -->

    <div class="settings-actions">

        <button
            id="save-settings"
            class="settings-save"
            type="button">

            Save Settings

        </button>


        <button
            id="settings-cancel"
            class="settings-cancel"
            type="button">

            Cancel

        </button>


        <div
            id="settings-message"
            class="settings-message">
        </div>

    </div>

</div>
