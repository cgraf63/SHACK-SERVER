<div class="card live-card">

    <div class="card-header">
        <h2>LIVE SPOT ACTIVITY</h2>
        <span class="view-link">
            View all spots →
        </span>
    </div>


    <div class="spot-filters">


        <div class="spot-search">

            <span class="search-icon">
                🔍
            </span>

            <input
                id="spotSearch"
                type="text"
                placeholder="Search..."
            >

        </div>



        <select id="bandFilter">
            <option value="">
                ALL BANDS
            </option>
        </select>



        <select id="modeFilter">
            <option value="">
                ALL MODES
            </option>
        </select>



        <select id="countryFilter">
            <option value="">
                ALL COUNTRIES
            </option>
        </select>



        <select id="sourceFilter">
            <option value="">
                ALL SOURCES
            </option>
        </select>



        <select id="confidenceFilter">

            <option value="">
                ALL SCORE
            </option>

            <option value="80">
                ≥ 80%
            </option>

            <option value="70">
                ≥ 70%
            </option>

            <option value="60">
                ≥ 60%
            </option>

        </select>

	<button id="resetView" class="reset-button">
   		🔄 RELOAD
	</button>



    </div>



    <table class="live-table">


        <thead>

            <tr>


                <th data-sort="call">
                    CALL <span class="sort-icon">↕</span>
                </th>


                <th data-sort="frequency">
                    FREQUENCY <span class="sort-icon">↕</span>
                </th>


                <th data-sort="mode">
                    MODE <span class="sort-icon">↕</span>
                </th>


                <th data-sort="distance">
                    DIST <span class="sort-icon">↕</span>
                </th>


                <th data-sort="azimuth">
                    AZ <span class="sort-icon">↕</span>
                </th>


                <th>
                    SOURCE
                </th>


                <th data-sort="age">
                    AGE <span class="sort-icon">↕</span>
                </th>


                <th data-sort="confidence">
                    SCORE <span class="sort-icon">↕</span>
                </th>


                <th>
                    ACTIONS
                </th>


            </tr>

        </thead>



        <tbody id="spotTableBody">


            <tr>

                <td colspan="9">
                    Waiting for data
                </td>

            </tr>


        </tbody>


    </table>


</div>
