<div class="card manual-qso-card">

    <h2>MANUAL QSO</h2>

    <div class="manual-qso-field">

        <label for="manual-qso-call">
            CALLSIGN
        </label>

        <div class="manual-qso-call-row">

            <input
                type="text"
                id="manual-qso-call"
                placeholder="CALLSIGN"
                autocomplete="off"
                spellcheck="false"
            >

            <button
                type="button"
                id="manual-qso-qrz"
                class="manual-qso-qrz-button"
                title="QRZ Lookup"
            >🔍</button>

            <img
                id="manual-qso-flag"
                class="manual-qso-flag"
                src=""
                alt=""
            >

        </div>

    </div>


    <div class="manual-qso-field">

        <label for="manual-qso-name">
            NAME
        </label>

        <input
            type="text"
            id="manual-qso-name"
            placeholder="NAME"
            autocomplete="off"
        >

    </div>


    <div class="manual-qso-row">

        <div class="manual-qso-field">

            <label for="manual-qso-band">
                BAND
            </label>


 <select id="manual-qso-band">

            <option value="">BAND</option>
            <option value="160m">160m</option>
            <option value="80m">80m</option>
            <option value="40m">40m</option>
            <option value="20m">20m</option>
            <option value="17m">17m</option>
            <option value="15m">15m</option>
            <option value="12m">12m</option>
            <option value="10m">10m</option>
            <option value="6m">6m</option>

        </select>

    </div>


        <div class="manual-qso-field">

            <label for="manual-qso-mode">
                MODE
            </label>

  <select id="manual-qso-mode">

            <option value="">MODE</option>
            <option value="SSB">SSB</option>
            <option value="USB">USB</option>
            <option value="LSB">LSB</option>
            <option value="CW">CW</option>
            <option value="FT8">FT8</option>
            <option value="FT4">FT4</option>

        </select>

        </div>

    </div>


    <div class="manual-qso-field">

        <label for="manual-qso-country">
            COUNTRY
        </label>

        <input
            type="text"
            id="manual-qso-country"
            placeholder="COUNTRY"
            autocomplete="off"
        >

    </div>


    <div class="manual-qso-row">

        <div class="manual-qso-field">

            <label for="manual-qso-itu">
                ITU
            </label>

            <input
                type="number"
                id="manual-qso-itu"
                placeholder="ITU"
                min="0"
                max="90"
            >

        </div>


        <div class="manual-qso-field">

            <label for="manual-qso-cq">
                CQ
            </label>

            <input
                type="number"
                id="manual-qso-cq"
                placeholder="CQ"
                min="0"
                max="40"
            >

        </div>

    </div>


    <div class="manual-qso-field">

        <label for="manual-qso-frequency">
            FREQUENCY
        </label>

        <input
            type="text"
            id="manual-qso-frequency"
            placeholder="FREQUENCY"
            autocomplete="off"
        >

    </div>

<div class="manual-qso-actions">

    <button
        type="button"
        id="manual-qso-open"
        class="manual-qso-open-button"
    >
        → QSO
    </button>

</div>

</div>
