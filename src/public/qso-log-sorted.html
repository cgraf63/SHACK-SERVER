<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QSO LOG – SHACK-SERVER</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<style>
html, body { width:100% !important; min-width:100% !important; margin:0 !important; padding:0 !important; }
body { min-height:100vh !important; box-sizing:border-box !important; overflow-x:auto !important; }
#app, main { display:block !important; width:100vw !important; min-width:100vw !important; min-height:100vh !important; margin:0 !important; padding:0 !important; box-sizing:border-box !important; }
main { max-width:none !important; }
.qso-log-page { display:block !important; width:100% !important; min-width:0 !important; max-width:none !important; margin:0 !important; padding:30px 40px !important; box-sizing:border-box !important; }
.qso-log-header { display:flex !important; width:100% !important; align-items:center !important; justify-content:space-between !important; gap:30px; margin:0 0 25px 0 !important; box-sizing:border-box; }
.qso-log-title { display:flex; flex-direction:column; }
.qso-log-header h1 { margin:0 !important; font-size:28px; line-height:1.2; color:#ff4fd8; }
.qso-log-count { margin-top:5px; color:#8fa3b2; font-size:14px; }
.qso-log-search { width:280px !important; min-width:220px; padding:10px 13px; border:1px solid #344754; border-radius:6px; background:#101c25; color:white; outline:none; box-sizing:border-box; }
.qso-log-search::placeholder { color:#71838f; }
.qso-log-search:focus { border-color:#607d8b; }
.qso-log-table-wrapper { display:block !important; width:100% !important; min-width:0 !important; max-width:none !important; overflow-x:auto !important; overflow-y:hidden; box-sizing:border-box; }
.qso-log-table { width:100% !important; min-width:1100px !important; max-width:none !important; border-collapse:collapse; background:#0b151e; }
.qso-log-table th { text-align:left; padding:12px 14px; border-bottom:1px solid #344754; color:#9fb1bd; font-size:13px; white-space:nowrap; cursor:pointer; user-select:none; }
.qso-log-table th:hover { color:white; }
.qso-log-table th.no-sort { cursor:default; }
.qso-log-table td { padding:12px 14px; border-bottom:1px solid #24343f; white-space:nowrap; }
.qso-log-table tbody tr:hover { background:rgba(255,255,255,.04); }
.qso-log-call { font-weight:600; }
.qso-log-actions { text-align:right; }
.qso-log-action { border:none; background:transparent; cursor:pointer; font-size:17px; padding:4px 7px; }
.qso-log-action:hover { transform:scale(1.1); }
.qso-log-empty { padding:35px !important; text-align:center; color:#71838f; }
.dx-flag { width:20px; height:14px; vertical-align:middle; margin-right:6px; object-fit:cover; }

/* EDIT DIALOG */
.qso-edit-overlay { position:fixed; inset:0; z-index:10000; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(0,0,0,.72); opacity:0; transition:opacity .18s ease; box-sizing:border-box; }
.qso-edit-overlay.visible { opacity:1; }
.qso-edit-dialog { width:min(900px,100%); max-height:calc(100vh - 40px); overflow-y:auto; background:#101c25; border:1px solid #344754; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.55); color:#fff; }
.qso-edit-header { display:flex; justify-content:space-between; align-items:center; padding:18px 22px; border-bottom:1px solid #344754; }
.qso-edit-title { font-size:20px; font-weight:600; }
.qso-edit-station { margin-top:4px; color:#8fa3b2; font-size:13px; }
.qso-edit-close { border:0; background:transparent; color:#b8c6ce; font-size:28px; cursor:pointer; line-height:1; }
.qso-edit-body { padding:22px; }
.qso-section-title { margin:22px 0 12px; color:#ff4fd8; font-size:13px; font-weight:600; letter-spacing:.08em; }
.qso-section-title:first-child { margin-top:0; }
.qso-form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:15px; }
.qso-field { min-width:0; }
.qso-field-wide { grid-column:1 / -1; }
.qso-field label { display:block; margin-bottom:6px; color:#9fb1bd; font-size:12px; }
.qso-field input, .qso-field textarea { width:100%; box-sizing:border-box; padding:10px 11px; border:1px solid #344754; border-radius:6px; background:#0b151e; color:#fff; outline:none; font:inherit; }
.qso-field input:focus, .qso-field textarea:focus { border-color:#607d8b; }
.qso-edit-footer { display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid #344754; }
.qso-btn { border:1px solid #344754; border-radius:6px; padding:10px 16px; cursor:pointer; font:inherit; }
.qso-btn-secondary { background:#172631; color:#d7e0e5; }
.qso-btn-primary { background:#ff4fd8; border-color:#ff4fd8; color:#111; font-weight:600; }
.qso-btn-danger { background:#7d2632; border-color:#9c3a47; color:#fff; }
.qso-btn:disabled { opacity:.55; cursor:default; }
.qso-delete-confirm { width:min(460px,100%); }
.qso-delete-text { color:#c4d0d6; line-height:1.5; }
@media (max-width:800px) {
 .qso-log-page { padding:20px !important; }
 .qso-log-header { align-items:flex-start !important; flex-direction:column !important; }
 .qso-log-search { width:100% !important; min-width:0; }
 .qso-form-grid { grid-template-columns:1fr; }
 .qso-field-wide { grid-column:auto; }
}
</style>
</head>
<body>
<div id="app">
<main>
<section class="qso-log-page">
<div class="qso-log-header">
<div class="qso-log-title">
<h1>QSO LOG</h1>
<div id="qso-log-count" class="qso-log-count">Loading...</div>
</div>
<input id="qso-log-search" class="qso-log-search" type="search" placeholder="Search callsign, country..." autocomplete="off">
</div>
<div class="qso-log-table-wrapper">
<table class="qso-log-table">
<thead><tr>
<th data-sort="qso_date">Date</th>
<th data-sort="time_on_utc">Time</th>
<th data-sort="call">Call</th>
<th data-sort="name">Name</th>
<th data-sort="band">Band</th>
<th data-sort="mode">Mode</th>
<th data-sort="frequency">Frequency</th>
<th data-sort="rst_sent">RST</th>
<th data-sort="country">Country</th>
<th data-sort="dx_grid">DX Grid</th>
<th class="no-sort">Actions</th>
</tr></thead>
<tbody id="qso-log-body"><tr><td colspan="11" class="qso-log-empty">Loading QSOs...</td></tr></tbody>
</table>
</div>
</section>
</main>
</div>
<script>
let qsoRecords = [];
let sortField = "qso_date";
let sortDirection = "desc";

async function loadQsoLog() {
    const body = document.getElementById("qso-log-body");
    const count = document.getElementById("qso-log-count");
    try {
        const response = await fetch("/api/qso");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        qsoRecords = Array.isArray(data.qsos) ? data.qsos : [];
        renderQsoLog();
    } catch (error) {
        console.error("QSO LOG:", error);
        count.textContent = "Error loading log";
        body.innerHTML = `<tr><td colspan="11" class="qso-log-empty">Could not load QSO log.</td></tr>`;
    }
}

function renderQsoLog() {
    const body = document.getElementById("qso-log-body");
    const count = document.getElementById("qso-log-count");
    const search = document.getElementById("qso-log-search");
    const searchText = search.value.trim().toLowerCase();
    const filtered = qsoRecords.filter(qso => {
        if (!searchText) return true;
        return [qso.call, qso.name, qso.country, qso.band, qso.mode, qso.dx_grid]
            .filter(value => value !== null && value !== undefined)
            .some(value => String(value).toLowerCase().includes(searchText));
    });

    filtered.sort((a,b) => compareValues(a[sortField], b[sortField]) * (sortDirection === "asc" ? 1 : -1));
    count.textContent = `${filtered.length} von ${qsoRecords.length} QSOs`;

    if (!filtered.length) {
        body.innerHTML = `<tr><td colspan="11" class="qso-log-empty">No QSOs found.</td></tr>`;
        updateSortHeaders();
        return;
    }

    body.innerHTML = filtered.map(qso => `
        <tr>
            <td>${escapeHtml(qso.qso_date || "")}</td>
            <td>${escapeHtml(qso.time_on_utc || "")}</td>
            <td class="qso-log-call">${escapeHtml(qso.call || "")}</td>
            <td>${escapeHtml(qso.name || "")}</td>
            <td>${escapeHtml(qso.band || "")}</td>
            <td>${escapeHtml(qso.mode || "")}</td>
            <td>${formatFrequency(qso.frequency)}</td>
            <td>${escapeHtml(qso.rst_sent || "")}/${escapeHtml(qso.rst_rcvd || "")}</td>
            <td>${qso.country_code ? `<img class="dx-flag" src="/assets/flags/${escapeHtml(qso.country_code)}.svg" alt="">` : ""}${escapeHtml(qso.country || "")}</td>
            <td>${escapeHtml(qso.dx_grid || "")}</td>
            <td class="qso-log-actions">
                <button class="qso-log-action" title="Edit QSO" data-action="edit" data-id="${qso.id}">✏️</button>
                <button class="qso-log-action" title="Delete QSO" data-action="delete" data-id="${qso.id}">🗑️</button>
            </td>
        </tr>`).join("");

    body.querySelectorAll(".qso-log-action").forEach(button => {
        button.addEventListener("click", () => handleQsoAction(button.dataset.action, Number(button.dataset.id)));
    });
    updateSortHeaders();
}

function compareValues(a,b) {
    if (a === null || a === undefined) a = "";
    if (b === null || b === undefined) b = "";
    if (typeof a === "number" && typeof b === "number") return a - b;
    return String(a).localeCompare(String(b), "de", {numeric:true, sensitivity:"base"});
}

function updateSortHeaders() {
    document.querySelectorAll(".qso-log-table th[data-sort]").forEach(th => {
        const field = th.dataset.sort;
        const base = th.dataset.baseLabel || th.textContent.replace(/[ ↑↓]$/, "");
        th.dataset.baseLabel = base;
        th.textContent = field === sortField ? `${base} ${sortDirection === "asc" ? "↑" : "↓"}` : base;
    });
}

function handleQsoAction(action,id) {
    const qso = qsoRecords.find(record => Number(record.id) === Number(id));
    if (!qso) return;
    if (action === "edit") openEditQsoDialog(qso);
    if (action === "delete") deleteQso(id, qso);
}

function openEditQsoDialog(qso) {
    closeEditQsoDialog();
    const overlay = document.createElement("div");
    overlay.id = "qso-edit-overlay";
    overlay.className = "qso-edit-overlay";
    overlay.innerHTML = `
        <div class="qso-edit-dialog">
            <div class="qso-edit-header">
                <div>
                    <div class="qso-edit-title">📝 Edit QSO</div>
                    <div class="qso-edit-station">${escapeHtml(qso.call || "--")}</div>
                </div>
                <button class="qso-edit-close" id="qso-edit-close" title="Close">×</button>
            </div>
            <div class="qso-edit-body">
                <div class="qso-section-title">BASIC QSO DATA</div>
                <div class="qso-form-grid">
                    ${editField("DATE UTC","qso-edit-date",qso.qso_date,"date")}
                    ${editField("START UTC","qso-edit-time-on",qso.time_on_utc,"time",true)}
                    ${editField("END UTC","qso-edit-time-off",qso.time_off_utc || "","time",true)}
                    ${editField("DX CALL","qso-edit-call",qso.call || "")}
                    ${editField("FREQUENCY kHz","qso-edit-frequency",formatFrequencyInput(qso.frequency),"number",false,"0.001")}
                    ${editField("BAND","qso-edit-band",qso.band || "")}
                    ${editField("MODE","qso-edit-mode",qso.mode || "")}
                    ${editField("RST SENT","qso-edit-rst-sent",qso.rst_sent || "59")}
                    ${editField("RST RECEIVED","qso-edit-rst-rcvd",qso.rst_rcvd || "59")}
                </div>
                <div class="qso-section-title">DX INFORMATION</div>
                <div class="qso-form-grid">
                    ${editField("NAME","qso-edit-name",qso.name || "")}
                    ${editField("COUNTRY","qso-edit-country",qso.country || "")}
                    ${editField("COUNTRY CODE","qso-edit-country-code",qso.country_code || "")}
                    ${editField("DX GRID","qso-edit-dx-grid",qso.dx_grid || "")}
                    ${editField("ITU","qso-edit-itu",qso.itu_zone ?? "","number")}
                    ${editField("CQ","qso-edit-cq",qso.cq_zone ?? "","number")}
                    <div class="qso-field qso-field-wide"><label>NOTES</label><textarea id="qso-edit-notes" rows="3">${escapeHtml(qso.notes || "")}</textarea></div>
                </div>
                <div class="qso-section-title">MY STATION</div>
                <div class="qso-form-grid">
                    ${editField("MY CALLSIGN","qso-edit-my-callsign",qso.my_callsign || "")}
                    ${editField("MY GRID","qso-edit-my-grid",qso.my_grid || "")}
                    ${editField("OPERATOR NAME","qso-edit-operator-name",qso.operator_name || "")}
                </div>
                <div class="qso-section-title">SPOT INFORMATION</div>
                <div class="qso-form-grid">
                    ${editField("SPOT SOURCE","qso-edit-spot-source",qso.spot_source || "")}
                    ${editField("SPOT ID","qso-edit-spot-id",qso.spot_id || "")}
                </div>
            </div>
            <div class="qso-edit-footer">
                <button class="qso-btn qso-btn-secondary" id="qso-edit-cancel">CANCEL</button>
                <button class="qso-btn qso-btn-primary" id="qso-edit-save">SAVE QSO</button>
            </div>
        </div>`;
    document.body.appendChild(overlay);
    requestAnimationFrame(() => overlay.classList.add("visible"));
    document.getElementById("qso-edit-close").addEventListener("click", closeEditQsoDialog);
    document.getElementById("qso-edit-cancel").addEventListener("click", closeEditQsoDialog);
    document.getElementById("qso-edit-save").addEventListener("click", () => saveEditedQso(qso.id));
    overlay.addEventListener("click", event => { if (event.target === overlay) closeEditQsoDialog(); });
}

function editField(label,id,value,type="text",withSeconds=false,step="") {
    const safe = escapeHtml(value ?? "");
    const seconds = type === "time" && withSeconds ? " step=\"1\"" : "";
    const stepAttr = step ? ` step="${step}"` : "";
    return `<div class="qso-field"><label>${label}</label><input id="${id}" type="${type}" value="${safe}"${seconds}${stepAttr}></div>`;
}

async function saveEditedQso(id) {
    const button = document.getElementById("qso-edit-save");
    if (button) { button.disabled = true; button.textContent = "SAVING..."; }
    const value = id => document.getElementById(id)?.value ?? "";
    const frequencyKHz = Number(value("qso-edit-frequency"));
    const payload = {
        qso_date:value("qso-edit-date"), time_on_utc:value("qso-edit-time-on"), time_off_utc:value("qso-edit-time-off") || null,
        call:value("qso-edit-call").trim().toUpperCase(), frequency:Math.round(frequencyKHz * 1000),
        band:value("qso-edit-band").trim(), mode:value("qso-edit-mode").trim().toUpperCase(),
        rst_sent:value("qso-edit-rst-sent").trim() || "59", rst_rcvd:value("qso-edit-rst-rcvd").trim() || "59",
        my_callsign:value("qso-edit-my-callsign").trim().toUpperCase(), my_grid:value("qso-edit-my-grid").trim().toUpperCase(),
        operator_name:value("qso-edit-operator-name").trim(), name:value("qso-edit-name").trim() || null,
        country:value("qso-edit-country").trim() || null, country_code:value("qso-edit-country-code").trim().toLowerCase() || null,
        dx_grid:value("qso-edit-dx-grid").trim().toUpperCase() || null,
        itu_zone:optionalNumber(value("qso-edit-itu")), cq_zone:optionalNumber(value("qso-edit-cq")),
        notes:value("qso-edit-notes").trim() || null, spot_source:value("qso-edit-spot-source").trim() || null,
        spot_id:value("qso-edit-spot-id").trim() || null
    };
    if (!payload.qso_date || !payload.time_on_utc || !payload.call || !Number.isFinite(payload.frequency) || !payload.band || !payload.mode || !payload.my_callsign || !payload.my_grid) {
        alert("Please fill in all required QSO fields.");
        if (button) { button.disabled=false; button.textContent="SAVE QSO"; }
        return;
    }
    try {
        const response = await fetch(`/api/qso/${encodeURIComponent(id)}`, { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload) });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
        const index = qsoRecords.findIndex(q => Number(q.id) === Number(id));
        if (index >= 0 && data.qso) qsoRecords[index] = data.qso;
        closeEditQsoDialog();
        renderQsoLog();
    } catch (error) {
        console.error("QSO update:",error);
        alert(`Could not update QSO.\n${error.message}`);
        if (button) { button.disabled=false; button.textContent="SAVE QSO"; }
    }
}

async function deleteQso(id,qso) {
    const overlay = document.createElement("div");
    overlay.className="qso-edit-overlay";
    overlay.innerHTML=`<div class="qso-edit-dialog qso-delete-confirm"><div class="qso-edit-header"><div><div class="qso-edit-title">🗑️ Delete QSO</div></div><button class="qso-edit-close" data-cancel>×</button></div><div class="qso-edit-body"><div class="qso-delete-text">Delete QSO <strong>${escapeHtml(qso.call || "")}</strong> permanently?</div></div><div class="qso-edit-footer"><button class="qso-btn qso-btn-secondary" data-cancel>CANCEL</button><button class="qso-btn qso-btn-danger" data-delete>DELETE</button></div></div>`;
    document.body.appendChild(overlay);
    requestAnimationFrame(()=>overlay.classList.add("visible"));
    overlay.querySelectorAll("[data-cancel]").forEach(el=>el.addEventListener("click",()=>overlay.remove()));
    overlay.querySelector("[data-delete]").addEventListener("click",async()=>{
        const button=overlay.querySelector("[data-delete]"); button.disabled=true; button.textContent="DELETING...";
        try {
            const response=await fetch(`/api/qso/${encodeURIComponent(id)}`,{method:"DELETE"});
            const data=await response.json().catch(()=>({}));
            if(!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
            qsoRecords=qsoRecords.filter(record=>Number(record.id)!==Number(id));
            overlay.remove(); renderQsoLog();
        } catch(error) { console.error("QSO delete:",error); alert(`Could not delete QSO.\n${error.message}`); button.disabled=false; button.textContent="DELETE"; }
    });
}

function closeEditQsoDialog() {
    const overlay=document.getElementById("qso-edit-overlay");
    if(overlay) overlay.remove();
}
function optionalNumber(value) { if(value === "") return null; const n=Number(value); return Number.isInteger(n) ? n : null; }
function formatFrequency(frequency) { const value=Number(frequency); if(!Number.isFinite(value)) return ""; return (value/1000).toLocaleString("de-CH",{minimumFractionDigits:1,maximumFractionDigits:3})+" kHz"; }
function formatFrequencyInput(frequency) { const value=Number(frequency); return Number.isFinite(value) ? (value/1000).toFixed(3) : ""; }
function escapeHtml(value) { return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"); }

document.getElementById("qso-log-search").addEventListener("input",renderQsoLog);
document.querySelectorAll(".qso-log-table th[data-sort]").forEach(th=>{
    th.addEventListener("click",()=>{
        const field=th.dataset.sort;
        if(sortField===field) sortDirection=sortDirection==="asc"?"desc":"asc";
        else { sortField=field; sortDirection="asc"; }
        renderQsoLog();
    });
});
document.addEventListener("keydown",event=>{ if(event.key==="Escape") closeEditQsoDialog(); });
loadQsoLog();
</script>
</body>
</html>
