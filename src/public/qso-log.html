<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QSO LOG – SHACK-SERVER</title>

    <link
        rel="icon"
        type="image/x-icon"
        href="/favicon.ico"
    >

    <link
        rel="stylesheet"
        href="/css/variables.css"
    >

    <link
        rel="stylesheet"
        href="/css/theme.css"
    >

    <link
        rel="stylesheet"
        href="/css/layout.css"
    >

    <link
        rel="stylesheet"
        href="/css/components.css"
    >


    <style>

        /*
        ============================================================
        QSO LOG
        Completely independent from dashboard layout
        ============================================================
        */

        html {

            width: 100% !important;
            min-width: 100% !important;

            margin: 0 !important;
            padding: 0 !important;

        }


        body {

            width: 100vw !important;
            min-width: 100vw !important;

            min-height: 100vh !important;

            margin: 0 !important;
            padding: 0 !important;

            box-sizing: border-box !important;

            overflow-x: auto !important;

        }


        #app {

            display: block !important;

            width: 100vw !important;
            min-width: 100vw !important;

            min-height: 100vh !important;

            margin: 0 !important;
            padding: 0 !important;

            box-sizing: border-box !important;

        }


        main {

            display: block !important;

            width: 100vw !important;
            min-width: 100vw !important;

            max-width: none !important;

            margin: 0 !important;
            padding: 0 !important;

            box-sizing: border-box !important;

        }


        /*
        ============================================================
        PAGE
        ============================================================
        */

        .qso-log-page {

            display: block !important;

            width: 100% !important;
            min-width: 0 !important;

            max-width: none !important;

            margin: 0 !important;

            padding: 30px 40px !important;

            box-sizing: border-box !important;

        }


        /*
        ============================================================
        HEADER
        ============================================================
        */

        .qso-log-header {

            display: flex !important;

            width: 100% !important;

            align-items: center !important;
            justify-content: space-between !important;

            gap: 30px;

            margin: 0 0 25px 0 !important;

            box-sizing: border-box;
    color: #ff4fd8;


        }


        .qso-log-title {

            display: flex;

            flex-direction: column;

        }


        .qso-log-header h1 {

            margin: 0 !important;

            font-size: 28px;

            line-height: 1.2;

        }


        .qso-log-count {

            margin-top: 5px;

            color: #8fa3b2;

            font-size: 14px;

        }


        /*
        ============================================================
        SEARCH
        ============================================================
        */

        .qso-log-search {

            width: 280px !important;

            min-width: 220px;

            padding: 10px 13px;

            border: 1px solid #344754;

            border-radius: 6px;

            background: #101c25;

            color: white;

            outline: none;

            box-sizing: border-box;

        }


        .qso-log-search::placeholder {

            color: #71838f;

        }


        .qso-log-search:focus {

            border-color: #607d8b;

        }


        /*
        ============================================================
        TABLE CONTAINER
        ============================================================
        */

        .qso-log-table-wrapper {

            display: block !important;

            width: 100% !important;

            min-width: 0 !important;

            max-width: none !important;

            overflow-x: auto !important;

            overflow-y: hidden;

            box-sizing: border-box;

        }


        /*
        ============================================================
        TABLE
        ============================================================
        */

        .qso-log-table {

            width: 100% !important;

            min-width: 1100px !important;

            max-width: none !important;

            border-collapse: collapse;

            background: #0b151e;

        }


        .qso-log-table th {

            text-align: left;

            padding: 12px 14px;

            border-bottom: 1px solid #344754;

            color: #9fb1bd;

            font-size: 13px;

            white-space: nowrap;

        }


        .qso-log-table td {

            padding: 12px 14px;

            border-bottom: 1px solid #24343f;

            white-space: nowrap;

        }


        .qso-log-table tbody tr:hover {

            background: rgba(
                255,
                255,
                255,
                0.04
            );

        }


        /*
        ============================================================
        CALL
        ============================================================
        */

        .qso-log-call {

            font-weight: 600;

        }


        /*
        ============================================================
        ACTIONS
        ============================================================
        */

        .qso-log-actions {

            text-align: right;

        }


        .qso-log-action {

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 17px;

            padding: 4px 7px;

        }


        .qso-log-action:hover {

            transform: scale(1.1);

        }


        /*
        ============================================================
        EMPTY
        ============================================================
        */

        .qso-log-empty {

            padding: 35px !important;

            text-align: center;

            color: #71838f;

        }


        /*
        ============================================================
        MOBILE
        ============================================================
        */

        @media (max-width: 800px) {

            .qso-log-page {

                padding: 20px !important;

            }


            .qso-log-header {

                align-items: flex-start !important;

                flex-direction: column !important;

            }


            .qso-log-search {

                width: 100% !important;

                min-width: 0;

            }

        }

    </style>

</head>


<body>


<div id="app">


    <main>


        <section class="qso-log-page">


            <div class="qso-log-header">


                <div class="qso-log-title">

                    <h1>
                        QSO LOG
                    </h1>

                    <div
                        id="qso-log-count"
                        class="qso-log-count"
                    >
                        Loading...
                    </div>

                </div>


                <input
                    id="qso-log-search"
                    class="qso-log-search"
                    type="search"
                    placeholder="Search callsign, country..."
                    autocomplete="off"
                >


            </div>


            <div class="qso-log-table-wrapper">


                <table class="qso-log-table">


                    <thead>

                        <tr>

                            <th>Date</th>

                            <th>Time</th>

                            <th>Call</th>

       			    <th>Name</th>
 
                            <th>Band</th>

                            <th>Mode</th>

                            <th>Frequency</th>

                            <th>RST</th>

                            <th>Country</th>

                            <th>DX Grid</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="qso-log-body">

                        <tr>

                            <td
                                colspan="10"
                                class="qso-log-empty"
                            >
                                Loading QSOs...
                            </td>

                        </tr>

                    </tbody>


                </table>


            </div>


        </section>


    </main>


</div>


<script>


let qsoRecords = [];


async function loadQsoLog() {

    const body =
        document.getElementById(
            "qso-log-body"
        );


    const count =
        document.getElementById(
            "qso-log-count"
        );


    try {

        const response =
            await fetch(
                "/api/qso"
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        qsoRecords =
            Array.isArray(data.qsos)
                ? data.qsos
                : [];
 

    
        renderQsoLog();

    }
    catch (error) {

        console.error(
            "QSO LOG:",
            error
        );


        count.textContent =
            "Error loading log";


        body.innerHTML = `

            <tr>

                <td
                    colspan="10"
                    class="qso-log-empty"
                >
                    Could not load QSO log.
                </td>

            </tr>

        `;

    }

}


function renderQsoLog() {

    const body =
        document.getElementById(
            "qso-log-body"
        );


    const count =
        document.getElementById(
            "qso-log-count"
        );


    const search =
        document.getElementById(
            "qso-log-search"
        );


    const searchText =
        search.value
            .trim()
            .toLowerCase();


    const filtered =
        qsoRecords.filter(
            qso => {

                if (!searchText) {

                    return true;

                }


                return [

                    qso.call,
                    qso.country,
                    qso.band,
                    qso.mode,
                    qso.dx_grid

                ]
                .filter(
                    value =>
                        value !== null &&
                        value !== undefined
                )
                .some(
                    value =>
                        String(value)
                            .toLowerCase()
                            .includes(
                                searchText
                            )
                );

            }
        );


    count.textContent =
        `${filtered.length} von ${qsoRecords.length} QSOs`;


    if (!filtered.length) {

        body.innerHTML = `

            <tr>

                <td
                    colspan="10"
                    class="qso-log-empty"
                >
                    No QSOs found.
                </td>

            </tr>

        `;

        return;

    }


    body.innerHTML =

        filtered
            .map(
                qso => `

                <tr>

                    <td>
                        ${escapeHtml(
                            qso.qso_date || ""
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            qso.time_on_utc || ""
                        )}
                    </td>

                    <td class="qso-log-call">
                        ${escapeHtml(
                            qso.call || ""
                        )}
                    </td>

<td>
    ${escapeHtml(
        qso.name || ""
    )}
</td>


                    <td>
                        ${escapeHtml(
                            qso.band || ""
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            qso.mode || ""
                        )}
                    </td>

                    <td>
                        ${formatFrequency(
                            qso.frequency
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            qso.rst_sent || ""
                        )}
                        /
                        ${escapeHtml(
                            qso.rst_rcvd || ""
                        )}
                    </td>

                    
<td>
    ${
        qso.country_code
            ? `<img
                    class="dx-flag"
                    src="/assets/flags/${qso.country_code}.svg"
                    style="width:20px; height:14px; vertical-align:middle; margin-right:6px;"
               >`
            : ""
    }
    ${escapeHtml(
        qso.country || ""
    )}
</td>


                    <td>
                        ${escapeHtml(
                            qso.dx_grid || ""
                        )}
                    </td>

                    <td class="qso-log-actions">

                        <button
                            class="qso-log-action"
                            title="Edit QSO"
                            data-action="edit"
                            data-id="${qso.id}"
                        >
                            ✏️
                        </button>

                        <button
                            class="qso-log-action"
                            title="Delete QSO"
                            data-action="delete"
                            data-id="${qso.id}"
                        >
                            🗑️
                        </button>

                    </td>

                </tr>

                `
            )
            .join("");


    body
        .querySelectorAll(
            ".qso-log-action"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        console.log(
                            "QSO action:",
                            button.dataset.action,
                            button.dataset.id
                        );

                    }
                );

            }
        );

}


function formatFrequency(
    frequency
) {

    const value =
        Number(frequency);


    if (!Number.isFinite(value)) {

        return "";

    }


    return (

        value / 1000

    )
    .toLocaleString(
        "de-CH",
        {
            minimumFractionDigits: 1,
            maximumFractionDigits: 3
        }
    )
    + " kHz";

}


function escapeHtml(
    value
) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


document
    .getElementById(
        "qso-log-search"
    )
    .addEventListener(
        "input",
        renderQsoLog
    );


loadQsoLog();


</script>


</body>

</html>
