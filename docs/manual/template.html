<!doctype html>
<html lang="$lang$">
<head>
<meta charset="utf-8">
<title>$pagetitle$</title>
<link rel="stylesheet" href="manual.css">
</head>
<body>

<section class="cover">
  <div class="cover-inner">
    <img class="cover-logo" src="images/cover-logo.png" alt="">
    <h1 class="cover-title">$title$</h1>
    <div class="cover-subtitle">$subtitle$</div>
    <div class="cover-tagline">$tagline$</div>
    <div class="cover-meta">
      <div>Version $version$ · $date$</div>
      <div>$author$</div>
    </div>
  </div>
</section>

<nav id="TOC" class="toc">
<h1 class="toc-title">$toc-title$</h1>
$table-of-contents$
</nav>

<main class="content">
$body$
</main>

</body>
</html>
